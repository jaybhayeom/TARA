<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TARA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0c0c14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
      animation: pulse 2s infinite ease-in-out;
    }
    .title {
      color: rgba(255,255,255,0.9);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .status {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6)); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <img src="../build/icon.png" class="logo" alt="TARA Logo">
  <div class="title">TARA</div>
  <div class="status">Initializing AI Environment...</div>
</body>
</html>
